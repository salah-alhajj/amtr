<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient: Apple Blue to Emerald Green -->
    <linearGradient id="amtrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#007AFF" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Isometric Cube Outer Hexagon & Grid Structure -->
    <!-- Center Point: (250, 210), Radius: 120 -->
    <!-- Top vertex: (250, 90) -->
    <!-- Top Right vertex: (354, 150) -->
    <!-- Bottom Right vertex: (354, 270) -->
    <!-- Bottom vertex: (250, 330) -->
    <!-- Bottom Left vertex: (146, 270) -->
    <!-- Top Left vertex: (146, 150) -->
    
    <!-- Outer Box Border -->
    <polygon points="250,90 354,150 354,270 250,330 146,270 146,150" 
             fill="none" 
             stroke="url(#amtrGrad)" 
             stroke-width="14" 
             stroke-linejoin="round" 
             stroke-linecap="round" />

    <!-- Isometric Cargo Grid / Inner Dividers -->
    <!-- Top Face Dividers -->
    <line x1="250" y1="90" x2="250" y2="210" stroke="url(#amtrGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="146" y1="150" x2="354" y2="270" stroke="url(#amtrGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.3" />
    <line x1="354" y1="150" x2="250" y2="210" stroke="url(#amtrGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="146" y1="150" x2="250" y2="210" stroke="url(#amtrGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="250" y1="210" x2="250" y2="330" stroke="url(#amtrGrad)" stroke-width="10" stroke-linecap="round" opacity="0.4" />

    <!-- Stylized Integrated Monogram "A" (Dynamic Precision & Dimension) -->
    <!-- Peak of A at (250, 130), Left leg to (185, 290), Right leg to (315, 290) -->
    <path d="M 250 125 L 180 295 L 212 295 L 230 250 L 270 250 L 288 295 L 320 295 Z M 250 190 L 263 226 L 237 226 Z" 
          fill="url(#amtrGrad)" 
          stroke="url(#amtrGrad)" 
          stroke-width="4" 
          stroke-linejoin="round" />

    <!-- Precision Dimension Measurement Tickmarks ("أمتار" / Scale Indicator) -->
    <circle cx="250" cy="90" r="6" fill="#007AFF" />
    <circle cx="354" cy="150" r="6" fill="#06B6D4" />
    <circle cx="354" cy="270" r="6" fill="#059669" />
    <circle cx="250" cy="330" r="6" fill="#059669" />
    <circle cx="146" cy="270" r="6" fill="#06B6D4" />
    <circle cx="146" cy="150" r="6" fill="#007AFF" />
  </g>

  <!-- Wordmark 'amtr' -->
  <text x="250" y="415" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'IBM Plex Sans Arabic', sans-serif" 
        font-size="46" 
        font-weight="700" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="url(#amtrGrad)">amtr</text>
  
  <!-- Subtitle Tagline -->
  <text x="250" y="445" 
        font-family="system-ui, -apple-system, 'SF Pro Text', 'IBM Plex Sans Arabic', sans-serif" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#6B7280">LOGISTICS &amp; COMMERCE</text>
</svg>
